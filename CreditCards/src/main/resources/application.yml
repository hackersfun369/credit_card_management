spring:
  application:
    name: CreditCards
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/freepdb1
    username: ${DB_USERNAME:system}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:4596/eureka/
    register-with-eureka: true
    fetch-registry: true
